<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Basics</title>
  </head>
  <body>
    <header>
      <h1>HTML Basics</h1>
    </header>

    <main>
      <h2>Headings and Paragraphs</h2>
      <p>Hello World!</p>
      <p>My name is <strong>Yashvardhan</strong>.</p>
      <p>This is a paragraph with <b>bold</b> and <i>italic</i> text.</p>

      <h3>More Heading Levels</h3>
      <h4>Even smaller heading</h4>
      <h5>Another heading</h5>
      <h6>The smallest valid heading</h6>

      <p>This is my first paragraph.</p>
      <p>This is my second paragraph.</p>
    </main>

    <footer>
      <p>&copy; 2024 Yashvardhan</p>
    </footer>
  </body>
</html>
